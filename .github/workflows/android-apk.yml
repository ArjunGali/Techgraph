name: Build PG Management APK

# Builds the single APK that serves both phones and tablets, and attaches it to
# the run as a downloadable artifact.
#
# This exists because the APK cannot be built without Google's Maven repository
# and the Android SDK. GitHub's runners have both preinstalled, so the build
# runs here rather than on a developer machine.

on:
  # "Run workflow" in the Actions tab, with the API address as an input.
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API address the app should talk to (https:// for release builds)'
        required: true
        default: 'http://10.0.2.2:4000'
      build_type:
        description: 'Which APK to build'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
      auto_login_email:
        description: 'Sign in automatically as this user (blank shows the sign-in screen)'
        required: false
        default: 'admin@pgmanagement.local'
      auto_login_password:
        description: 'Password for automatic sign-in. Prefer the PG_AUTO_LOGIN_PASSWORD secret — a value typed here is visible in the run log.'
        required: false
        default: ''

  push:
    branches:
      - 'claude/pg-management-android-apk-**'
    paths:
      - 'pg-management/**'
      - '.github/workflows/android-apk.yml'

# Only the newest run per branch needs to finish.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Needed to publish the APK as a release asset.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pg-management
    env:
      # Lifted to job level because the `secrets` context cannot be read from a
      # step's `if:` condition, but `env` can.
      KEYSTORE_BASE64: ${{ secrets.PG_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pg-management/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pg-management/android/**/*.gradle', 'pg-management/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run the calculation engine tests
        # The engine decides what every tenant is charged, so a failure here
        # stops the build before an APK is produced.
        run: npm test --workspace server

      - name: Build the web client
        env:
          # Compiled into the APK. It is only an address — no credential is
          # ever built into the package. It can also be changed on the device
          # under "Server settings" on the sign-in screen.
          NEXT_PUBLIC_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://10.0.2.2:4000' }}
          # Single-user mode: the app signs itself in and opens on the dashboard.
          # The secret wins over the workflow input, so a real password never has
          # to be typed into a field that is recorded in the run log.
          NEXT_PUBLIC_AUTO_LOGIN_EMAIL: ${{ github.event.inputs.auto_login_email || 'admin@pgmanagement.local' }}
          NEXT_PUBLIC_AUTO_LOGIN_PASSWORD: ${{ secrets.PG_AUTO_LOGIN_PASSWORD || github.event.inputs.auto_login_password || 'ChangeMe!2026' }}
        run: npm run build:web

      - name: Sync the web build into the Android project
        run: npx cap sync android

      - name: Decode the release keystore
        # Skipped unless the repository has signing secrets. Without them the
        # release build would produce an unsigned, uninstallable APK, so the
        # workflow falls back to a debug build instead.
        id: keystore
        if: ${{ github.event.inputs.build_type == 'release' && env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        env:
          PG_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          PG_KEYSTORE_PASSWORD: ${{ secrets.PG_KEYSTORE_PASSWORD }}
          PG_KEYSTORE_ALIAS: ${{ secrets.PG_KEYSTORE_ALIAS }}
          PG_KEY_PASSWORD: ${{ secrets.PG_KEY_PASSWORD }}
        working-directory: pg-management/android
        run: |
          if [ -n "${{ steps.keystore.outputs.path }}" ]; then
            echo "Building a signed release APK."
            ./gradlew --no-daemon assembleRelease
          else
            if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
              echo "::warning::No signing secrets configured, so an unsigned release APK could not be installed. Building the debug APK instead — it is signed with Android's debug key and installs directly."
            fi
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Find the APK
        id: apk
        run: |
          apk=$(find android/app/build/outputs/apk -name '*.apk' -not -name '*unsigned*' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: pg-management-apk
          path: pg-management/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish the APK as a release asset
        # A workflow artifact needs a GitHub login and arrives as a zip, which
        # is awkward on a phone. A release asset is a direct .apk link anyone
        # can tap, and it does not expire after 30 days.
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://10.0.2.2:4000' }}
        run: |
          set -euo pipefail

          case "$APK_NAME" in
            *release*) variant=release ;;
            *)         variant=debug ;;
          esac
          asset="pg-management-${variant}.apk"
          cp "$APK_PATH" "$asset"

          # A fixed tag, replaced on every build, so the download URL never
          # changes and can be shared once.
          tag="apk-latest"

          {
            echo "Built from \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "**One APK for phones and tablets** - the layout adapts to the screen it is on."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Build | \`${variant}\` |"
            echo "| API address compiled in | \`${API_BASE_URL}\` |"
            echo
            echo "### Installing"
            echo
            echo "Download \`${asset}\` below and open it on the device, or run \`adb install -r ${asset}\`."
            echo "Android will ask you to allow installs from this source."
            echo
            echo "### Pointing it at your server"
            echo
            echo "You do **not** need a new build. On the sign-in screen tap **Server settings**"
            echo "and enter your API address. The app holds no database credentials - it talks to"
            echo "the PG Management API, which decides what your account may see."
            echo
            echo "This is a pre-release build for testing. Delete this release whenever you like;"
            echo "the next run recreates it."
          } > release-notes.md

          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$asset" \
            --title "PG Management APK (latest ${variant} build)" \
            --prerelease \
            --notes-file release-notes.md

          echo "Published: $(gh release view "$tag" --json url --jq .url)"

      - name: Summary
        run: |
          {
            echo "## PG Management APK"
            echo
            echo "**Download:** <https://github.com/${{ github.repository }}/releases/tag/apk-latest> — a direct .apk, no login needed."
            echo
            echo "Also attached to this run as the \`pg-management-apk\` artifact."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`${{ steps.apk.outputs.name }}\` |"
            echo "| Size | $(du -h "${{ steps.apk.outputs.path }}" | cut -f1) |"
            echo "| API address | \`${{ github.event.inputs.api_base_url || 'http://10.0.2.2:4000' }}\` |"
            echo
            echo "Install with \`adb install -r <file>.apk\`, or copy it to the device and open it."
            echo "One APK covers phones and tablets — the layout adapts to the screen it is on."
          } >> "$GITHUB_STEP_SUMMARY"
